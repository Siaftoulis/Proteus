[workspace]
resolver = "2"
members = [
    "proteus-core",
    "proteus-design-studio",
    "proteus-client",
    "proteus-web",
    "proteus-mobile",
    "license-server",
    "auth-server"
]

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "fat"
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
