[package]
name = "proteus-design-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
proteus-core = { path = "../proteus-core" }
eframe = "0.31"
egui = "0.31"
egui_dock = "0.14"
serde = { version = "1.0", features = ["derive"] }
