[package]
name = "crm-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "v7"] }
chrono = { version = "0.4.40", features = ["serde"] }
ureq = { version = "2.12.1", features = ["json"] }
thiserror = "2.0.12"
tracing = "0.1.42"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"
