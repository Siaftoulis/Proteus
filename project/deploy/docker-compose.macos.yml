services:
  macos-vm:
    image: sickcodes/docker-osx:auto
    container_name: proteus-macos-vm
    restart: "no"
    privileged: true
    environment:
      - EXTRA=-display none -vnc 0.0.0.0:0,websocket=6080
      - WIDTH=1920
      - HEIGHT=1080
      - RAM=8
      - SMP=4
      - CORES=4
    ports:
      - "50922:22"   # SSH into macOS
      - "5900:5900"   # VNC Desktop Viewer
      - "6080:6080"   # Web-based noVNC GUI (open in Chrome/Edge directly)
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../:/home/arch/crm-builder
    devices:
      - /dev/kvm:/dev/kvm
