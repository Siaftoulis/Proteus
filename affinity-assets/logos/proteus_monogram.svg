<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDE6ED"/>
      <stop offset="100%" stop-color="#9DB2BF"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#526D82"/>
      <stop offset="50%" stop-color="#9DB2BF"/>
      <stop offset="100%" stop-color="#DDE6ED"/>
    </linearGradient>
  </defs>
  <!-- Background Shield (Optional dark contrast container) -->
  <rect width="128" height="128" rx="24" fill="#1B2430" stroke="#27374D" stroke-width="2"/>
  
  <!-- Stem of P -->
  <line x1="36" y1="20" x2="36" y2="76" stroke="url(#slateGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Loop / Bowl of P -->
  <path d="M 36 20 L 70 20 C 88 20 88 50 70 50 L 36 50" fill="none" stroke="url(#slateGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Twin Marine Waves -->
  <!-- Upper wave -->
  <path d="M 22 92 C 44 80 74 104 106 88" fill="none" stroke="url(#waveGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Lower wave -->
  <path d="M 22 108 C 44 96 74 120 106 104" fill="none" stroke="url(#waveGrad)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
</svg>